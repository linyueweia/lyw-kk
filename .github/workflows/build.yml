name: Build iNextOS for KICKPI K1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      # 仅自动记录上游指纹的提交：镜像内容不变，无需重建
      - 'last-upstream-sha'
  schedule:
    # 每日 03:00（CST / UTC+8）检查上游框架是否更新，有更新则自动编译
    - cron: '0 19 * * *'

jobs:
  # ── 上游跟踪：比对 jjm2473/armbian-easepi 的 easepi-v26.02 分支 HEAD ──
  upstream:
    name: Check upstream framework (armbian-easepi)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4

      - name: Compare upstream HEAD with recorded sha
        id: cmp
        run: |
          set -eu
          UP=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jjm2473/armbian-easepi/branches/easepi-v26.02" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          OLD=$(cat last-upstream-sha 2>/dev/null | tr -d '\n' || echo none)
          echo "上游 easepi-v26.02 HEAD : $UP"
          echo "本仓库记录的指纹         : $OLD"
          if [ "$UP" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过构建。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$UP"       >> "$GITHUB_OUTPUT"
          fi

      - name: Record new upstream sha
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -eu
          echo "${{ steps.cmp.outputs.sha }}" > last-upstream-sha
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-upstream-sha
          git commit -m "chore: 记录上游框架指纹 ${{ steps.cmp.outputs.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build iNextOS image (KICKPI K1 / RK3568)
    needs: upstream
    # 手动触发 / push 时总是构建；定时任务只在上游有更新时构建
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          path: k1

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Inject KICKPI K1 board support
        run: |
          set -e
          cp -v k1/config/boards/kickpi-k1.csc build/config/boards/

          # 板级设备树（基于社区 j3ffs/Kickpi-K1 主线条目 + 厂商 BSP 写法）
          mkdir -p build/patch/kernel/rk35xx-vendor-6.1/dt
          cp -v k1/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1.dts \
                build/patch/kernel/rk35xx-vendor-6.1/dt/

          # 内核补丁：Maxio MAE0621A 千兆 PHY 驱动（K1 两个网口的命门）
          cp -v k1/patch/kernel/rk35xx-vendor-6.1/*.patch \
                build/patch/kernel/rk35xx-vendor-6.1/

          echo "--- board config (kickpi-k1.csc):"
          cat build/config/boards/kickpi-k1.csc
          echo "--- dts critical markers:"
          grep -nE '&gmac0|&gmac1|&mdio0|&sdhci|&sdmmc0|&sdmmc2|kickpi,k1' \
                build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1.dts || true
          echo "--- maxio patch markers:"
          grep -nE 'MAXIO_PHY_MAE0621A_Q2C_ID|config MAXIO_PHY|maxio\.o' \
                build/patch/kernel/rk35xx-vendor-6.1/general-drv-net-phy-maxio-mae0621a.patch || true
          # 自检：补丁里必须真的带着 Q2C 的 PHY ID（本机实机确认过 = 0x7b744411）
          grep -q 'MAXIO_PHY_MAE0621A_Q2C_ID 0x7b744411' \
                build/patch/kernel/rk35xx-vendor-6.1/general-drv-net-phy-maxio-mae0621a.patch \
            || { echo "!! Maxio 补丁内容异常"; exit 1; }

          # 自检：SWT6621S 驱动补丁必须包含三个模块的源码与 Kconfig 项
          P=build/patch/kernel/rk35xx-vendor-6.1/swt6621s-wifi-bt-driver.patch
          echo "--- swt6621s patch: $(du -h $P | cut -f1) ---"
          for k in 'config SEEKWAVE_BSP_DRIVERS' 'config SKW_SDIOHAL' \
                   'WLAN_VENDOR_SWT6621S' 'config SKW_BT' \
                   'drivers/net/wireless/seekwave/drivers/swtbt4l/skw_btdriver.c'; do
            grep -q "$k" "$P" || { echo "!! SWT6621S 补丁缺少: $k"; exit 1; }
            echo "    OK  $k"
          done

          # DDR 初始化固件：本机实测 K1 是 LPDDR4 @ 1560MHz
          # （设备树 lpddr4-params freq_0 = 0x618 = 1560；/sys/class/devfreq/dmc 上限 1560）
          # 框架对 rk3568 的默认值 rk35/rk3568_ddr_1560MHz_v1.21.bin 正好匹配，
          # 且 BL31 用的 rk3568_bl31_v1.44.elf 与厂商引导器里的 bl31-v1.44 完全一致。
          # 这里【不做替换】，只做正向自检：若上游改动默认值，立刻报警而不是静默编错固件。
          DDRINC=build/config/sources/families/include/rockchip64_common.inc
          if grep -q 'rk35/rk3568_ddr_1560MHz_v1.21.bin' "$DDRINC"; then
            echo "--- DDR 固件: 框架默认 1560MHz v1.21，与 K1 的 LPDDR4@1560 匹配 OK"
          else
            echo "!! 框架默认 rk3568 DDR 固件已变化，需重新评估是否匹配 K1 的 1560MHz LPDDR4"
            grep -n 'rk3568_ddr' "$DDRINC" | sed 's/^/    /'
            exit 1
          fi

      - name: Install KICKPI K1 extensions + WiFi firmware
        # 扩展放在 userpatches/extensions/ —— 框架会自动搜索该目录并加载。
        # 关键：框架只加载【可执行】的扩展脚本，权限不对会被静默跳过
        # （日志表现：Extension search result [ Found 0 extensions ]）
        # 固件走框架正规通道 userpatches/overlay/（chroot 内即 /tmp/overlay），
        # 由框架拷进镜像的 /lib/firmware/ —— 不在构建后往镜像里塞文件。
        run: |
          set -e
          mkdir -p build/userpatches/extensions
          cp -v k1/extensions/*.sh build/userpatches/extensions/
          chmod +x build/userpatches/extensions/*.sh
          ls -l build/userpatches/extensions/
          echo "--- extension critical markers:"
          grep -nE 'custom_kernel_config__|opts_[ym]|MAXIO_PHY|SWT6621S|roceos' \
                build/userpatches/extensions/*.sh
          grep -q 'kickpi_k1_roceos' build/userpatches/extensions/kickpi-k1-roceos.sh \
            || { echo "!! roceos 扩展缺失"; exit 1; }

          echo "--- SWT6621S 固件 -> overlay/lib/firmware/"
          mkdir -p build/userpatches/overlay/lib/firmware
          cp -v k1/firmware/SWT6621S_* build/userpatches/overlay/lib/firmware/
          ls -l build/userpatches/overlay/lib/firmware/ | head -20
          n=$(ls build/userpatches/overlay/lib/firmware/ | wc -l)
          echo "固件数量: $n"
          [ "$n" -ge 10 ] || { echo "!! 固件数量异常（实机有 15 个）"; exit 1; }

      - name: Fetch roceos web-UI payload into userpatches/overlay
        # 官方 iNextOS 镜像自带 roceos 网页后台（/opt/roceos + /opt/roceos-ai + 3 个
        # systemd 服务 + nginx 站点与证书 + Flask 栈）—— 没有它，板子能启动但网页后台是空的。
        # 走框架正规通道 userpatches/overlay 交给扩展在【构建阶段】装进镜像。
        run: |
          set -e
          mkdir -p build/userpatches/overlay
          URL="https://github.com/linyueweia/lyw-OS/releases/download/roceos-payload-v1/roceos-payload.tar.gz"
          curl -fsSL -o build/userpatches/overlay/roceos-payload.tar.gz "$URL"
          # 指纹固定断言：内容一变立即失败
          echo "6b819584a1b1701163f8983bd59a31821643f64dd65c76ba8f500ef54c5e8bb5  build/userpatches/overlay/roceos-payload.tar.gz" | sha256sum -c -
          ls -l build/userpatches/overlay/
          echo "--- 扩展清单（应含 kickpi-k1-roceos.sh）:"
          ls -l build/userpatches/extensions/ 2>/dev/null || true

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Build iNextOS image
        run: |
          cd build
          # 注释必须放在整条命令【之前】：放进 "\" 续行之间会把后续参数整段注释掉
          # （曾因此丢掉 KERNEL_CONFIGURE=no，框架弹出交互式菜单并以 error 43 失败）
          # ENABLE_EXTENSIONS 是扩展白名单（框架逐个 enable_extension），必须含自建扩展
          ./compile.sh build \
            BOARD=kickpi-k1 \
            BRANCH=vendor \
            RELEASE=trixie \
            ENABLE_EXTENSIONS="istorenext,kickpi-k1-maxio,kickpi-k1-wifi,kickpi-k1-roceos" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,img,xz" \
            SHARE_LOG=yes \
            EXPERT=yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-process verification (bootloader / DTB IP blocks / DDR fingerprint)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          # 注意路径：板级仓库在 CI 里检出到 ./k1（其余步骤也一律用 k1/…），
          # 写成 tools/… 会报 "cannot access 'tools/verify-image.sh'" 并在镜像
          # 已经编好的情况下把整发判失败（实测踩到）。
          chmod +x k1/tools/verify-image.sh
          # 必须 root：脚本要 losetup + mount 镜像分区（缺 sudo 会报
          #   mkdir: cannot create directory '/mnt/ib_v': Permission denied
          #   losetup: ... failed to set up loop device）
          sudo -E bash k1/tools/verify-image.sh "$IMG"

      - name: Verify image (Maxio PHY driver / dual GbE / DTB)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -1)
          echo "IMG=$IMG"
          LOOP=$(sudo losetup --show -f -P "$IMG")
          echo "LOOP=$LOOP"
          sudo mkdir -p /mnt/ib /mnt/ir
          sudo mount "${LOOP}p1" /mnt/ib || true
          sudo mount "${LOOP}p2" /mnt/ir || true
          echo "--- p1 内容:";  ls /mnt/ib | head -20
          echo "--- p2 内容:";  ls /mnt/ir | head -20
          FAIL=0

          # ── 检查 1：内核配置里 MUST 打开 CONFIG_MAXIO_PHY（本板两个千兆口的命门）──
          CFG=$(ls /mnt/ib/config-* /mnt/ir/boot/config-* 2>/dev/null | head -1 || true)
          if [ -n "$CFG" ]; then
            echo "--- kernel config: $CFG"
            if grep -qE '^CONFIG_MAXIO_PHY=y' "$CFG"; then
              echo "  OK  CONFIG_MAXIO_PHY=y"
            else
              echo "  !!  CONFIG_MAXIO_PHY 未启用 —— 两个网口将无法工作"; FAIL=1
            fi
            grep -E '^CONFIG_(MAXIO_PHY|MOTORCOMM_PHY|REALTEK_PHY|AIC8800_WLAN_SUPPORT)' "$CFG" || true
          else
            echo "  !!  镜像里找不到内核 config 文件"; FAIL=1
          fi

          # ── 检查 2：板级 DTB 必须存在、且两个 GMAC 都是 okay ──
          # 需要 dtc 反解 DTB；runner 默认没装（上一轮就因此失败：sudo: dtc: command not found）
          if ! command -v dtc >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq device-tree-compiler >/dev/null 2>&1 || true
          fi
          command -v dtc >/dev/null 2>&1 && echo "  dtc: $(dtc --version 2>&1 | head -1)" || echo "  ✗ dtc 仍不可用"
          DTB=$(ls /mnt/ib/dtb/rockchip/rk3568-kickpi-k1.dtb 2>/dev/null | head -1 || true)
          if [ -n "$DTB" ]; then
            echo "--- dtb: $DTB"
            dtc -I dtb -O dts "$DTB" -o /tmp/k1.dts 2>/dev/null || sudo dtc -I dtb -O dts "$DTB" -o /tmp/k1.dts
            echo "  model     : $(grep -m1 'model =' /tmp/k1.dts)"
            echo "  compatible: $(grep -m1 'compatible = \"kickpi' /tmp/k1.dts)"
            grep -A12 'ethernet@fe2a0000' /tmp/k1.dts | grep -m1 status | sed 's/^/  gmac0: /'
            grep -A12 'ethernet@fe010000' /tmp/k1.dts | grep -m1 status | sed 's/^/  gmac1: /'
            grep -q 'rockchip,rk3568-kickpi-k1\|kickpi,k1' /tmp/k1.dts || { echo "  !!  DTB 里没有 kickpi 标识"; FAIL=1; }
          else
            echo "  !!  镜像里找不到 rk3568-kickpi-k1.dtb"; FAIL=1
          fi

          # ── 检查 2b：SWT6621S WiFi/BT 驱动与固件（实机是树外驱动，本仓库自行编入）──
          echo "--- WiFi 固件："
          ls /mnt/ir/lib/firmware/SWT6621S_* 2>/dev/null | head -20
          FW=$(ls /mnt/ir/lib/firmware/SWT6621S_* 2>/dev/null | wc -l)
          if [ "$FW" -ge 10 ]; then echo "  OK  SWT6621S 固件 $FW 个"
          else echo "  !!  SWT6621S 固件缺失（实机有 15 个）"; FAIL=1; fi

          echo "--- SWT6621S 驱动模块："
          for m in swt6621s_wifi skw_sdio_lite skwbt; do
            f=$(find /mnt/ir/lib/modules -name "${m}.ko*" 2>/dev/null | head -1)
            if [ -n "$f" ]; then echo "  OK  $m -> $f"
            else echo "  (注) 未找到 $m.ko —— 若被编为内建(=y)则属正常，见内核配置检查"; fi
          done
          if [ -n "$CFG" ]; then
            grep -E '^CONFIG_(SEEKWAVE_BSP_DRIVERS|SKW_SDIOHAL|WLAN_VENDOR_SWT6621S|SKW_BT)' "$CFG" || true
            if grep -qE '^CONFIG_(SEEKWAVE_BSP_DRIVERS|WLAN_VENDOR_SWT6621S)=' "$CFG"; then
              echo "  OK  SWT6621S 相关配置已生效"
            else
              echo "  !!  SWT6621S 相关配置未生效"; FAIL=1
            fi
            if grep -qE '^CONFIG_SATA_AHCI_PLATFORM=y|^CONFIG_AHCI_DWC=' "$CFG"; then
              echo "  OK  SATA AHCI 配置在位"
            else
              echo "  !!  SATA AHCI 配置缺失（实机有 ata1 控制器）"; FAIL=1
            fi
            if grep -qE '^CONFIG_USB_SERIAL_OPTION=m|^CONFIG_USB_NET_QMI_WWAN=m' "$CFG"; then
              echo "  OK  4G/5G(USB 串口/QMI) 配置在位"
            else
              echo "  !!  4G/5G 相关配置缺失"; FAIL=1
            fi
          fi

          # ── 检查 3：armbianEnv 指向我们的 dtb ──
          if [ -f /mnt/ib/armbianEnv.txt ]; then
            echo "--- armbianEnv.txt:"; cat /mnt/ib/armbianEnv.txt
            grep -q 'rk3568-kickpi-k1.dtb' /mnt/ib/armbianEnv.txt \
              || { echo "  !!  armbianEnv.txt 未指向 rk3568-kickpi-k1.dtb"; FAIL=1; }
          fi

          sudo umount /mnt/ib /mnt/ir 2>/dev/null || true
          sudo losetup -d "$LOOP" || true
          [ "$FAIL" = "0" ] || { echo "!! 镜像自证失败"; exit 1; }
          echo "== 全部自证通过 =="

      - name: Show outputs
        run: |
          ls -lh build/output/images/ || true
          cat build/output/images/*.sha 2>/dev/null || true

      - name: Upload iNextOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inextos-kickpi-k1
          path: |
            build/output/images/*.img
            build/output/images/*.img.xz
            build/output/images/*.sha
          retention-days: 14
          if-no-files-found: error
