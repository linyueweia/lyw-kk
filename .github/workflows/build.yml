name: Build iNextOS for KICKPI K1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      # 仅自动记录上游指纹的提交：镜像内容不变，无需重建
      - 'last-upstream-sha'
  schedule:
    # 每日 03:00（CST / UTC+8）检查上游框架是否更新，有更新则自动编译
    - cron: '0 19 * * *'

jobs:
  # ── 上游跟踪：比对 jjm2473/armbian-easepi 的 easepi-v26.02 分支 HEAD ──
  upstream:
    name: Check upstream framework (armbian-easepi)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4

      - name: Compare upstream HEAD with recorded sha
        id: cmp
        run: |
          set -eu
          UP=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jjm2473/armbian-easepi/branches/easepi-v26.02" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          OLD=$(cat last-upstream-sha 2>/dev/null | tr -d '\n' || echo none)
          echo "上游 easepi-v26.02 HEAD : $UP"
          echo "本仓库记录的指纹         : $OLD"
          if [ "$UP" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过构建。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$UP"       >> "$GITHUB_OUTPUT"
          fi

      - name: Record new upstream sha
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -eu
          echo "${{ steps.cmp.outputs.sha }}" > last-upstream-sha
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-upstream-sha
          git commit -m "chore: 记录上游框架指纹 ${{ steps.cmp.outputs.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build iNextOS image (KICKPI K1 / RK3568)
    needs: upstream
    # 手动触发 / push 时总是构建；定时任务只在上游有更新时构建
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          path: k1

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Inject KICKPI K1 board support
        run: |
          set -e
          cp -v k1/config/boards/kickpi-k1.csc build/config/boards/

          # 板级设备树（基于社区 j3ffs/Kickpi-K1 主线条目 + 厂商 BSP 写法）
          mkdir -p build/patch/kernel/rk35xx-vendor-6.1/dt
          cp -v k1/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1.dts \
                build/patch/kernel/rk35xx-vendor-6.1/dt/

          # 内核补丁：Maxio MAE0621A 千兆 PHY 驱动（K1 两个网口的命门）
          cp -v k1/patch/kernel/rk35xx-vendor-6.1/*.patch \
                build/patch/kernel/rk35xx-vendor-6.1/

          echo "--- board config (kickpi-k1.csc):"
          cat build/config/boards/kickpi-k1.csc
          echo "--- dts critical markers:"
          grep -nE '&gmac0|&gmac1|&mdio0|&sdhci|&sdmmc0|&sdmmc2|kickpi,k1' \
                build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1.dts || true
          echo "--- maxio patch markers:"
          grep -nE 'MAXIO_PHY_MAE0621A_Q2C_ID|config MAXIO_PHY|maxio\.o' \
                build/patch/kernel/rk35xx-vendor-6.1/general-drv-net-phy-maxio-mae0621a.patch || true
          # 自检：补丁里必须真的带着 Q2C 的 PHY ID（本机实机确认过 = 0x7b744411）
          grep -q 'MAXIO_PHY_MAE0621A_Q2C_ID 0x7b744411' \
                build/patch/kernel/rk35xx-vendor-6.1/general-drv-net-phy-maxio-mae0621a.patch \
            || { echo "!! Maxio 补丁内容异常"; exit 1; }

          # 自检：补丁 hunk 行数一致性（2026-10-14 编译失败事故的防线）
          # 声明行数 < 实际行数时 GNU patch 不报错、直接丢掉文件末尾几行 —— 当时
          # boot_config.h 的末 2 行（含 #endif）被丢，编译以几百条 "unterminated #ifndef"
          # 假错误炸掉，白跑一整车。这里在构建早期把这类截断拦死。
          python3 k1/tools/patch-hunk-lint.py k1/patch/kernel/rk35xx-vendor-6.1 \
            || { echo "!! 补丁 hunk 行数不一致（文件末尾会被静默截断）"; exit 1; }

          # 自检：verify-image.sh 里不得有自相矛盾断言（同一路径既"必须存在"又"必须不存在"）
          # 2026-10-17 run #49 事故：删 EEE 关闭扩展时只加了反向断言、漏删两条正向断言，
          # 结果镜像**已经编好**，才在 step 10 里同时打印"✓ 无 …"与"✗ 缺 …"判失败 —— 整车白跑。
          python3 k1/tools/verify-assert-lint.py k1/tools/verify-image.sh \
            || { echo "!! verify-image.sh 存在自相矛盾断言（构建会成功、自检必红）"; exit 1; }

          # DDR 初始化固件 —— 必须换成【真机 eMMC 原厂同款】，不能用框架默认。
          # 证据链（四方，2026-10-12 定案）：
          #   1) K1 eMMC 原厂 idbloader 的 DDR = ddr-v1.23-03ea844c5d（本机实测提取，
          #      与飞牛基镜像同哈希；飞牛线全部成功启动用的就是它）；
          #   2) rkbin 中 03ea844c5d 对应文件名 rk3568_ddr_1056MHz_v1.23.bin
          #      （lyw-OS 侧 sha256 20e4bb07… 逐字节比对过）；
          #   3) 框架默认 rk3568_ddr_1560MHz_v1.21.bin 在同方案 T68M 上 DDR 训练失败
          #      （上电无任何输出，lyw-OS README 证据链），换 v1.23 后实测启动成功；
          #   4) K1 飞牛线实测：另一份 1560 系列固件（v1.26 + U-Boot 2023.10）
          #      SPL 阶段即断（电源灯亮、系统灯不亮）—— 1560 系列在本板不可信。
          # 结论：文件名频率 ≠ 可用判据，真机原厂指纹（v1.23-03ea844c5d）才是金标准。
          # 与 lyw-OS（T68M，同框架同 defconfig 实测可启动）做法对齐：
          DDRINC=build/config/sources/families/include/rockchip64_common.inc
          n_before=$(grep -c 'rk35/rk3568_ddr_1560MHz_v1.21.bin' "$DDRINC" || true)
          if [ "$n_before" -ne 1 ]; then
            echo "!! 框架默认 rk3568 DDR 固件形态已变化（1560_v1.21 命中 $n_before 次），需重新评估"
            grep -n 'rk3568_ddr' "$DDRINC" | sed 's/^/    /'
            exit 1
          fi
          sed -i 's#rk35/rk3568_ddr_1560MHz_v1.21.bin#rk35/rk3568_ddr_1056MHz_v1.23.bin#' "$DDRINC"
          n_after=$(grep -c 'rk35/rk3568_ddr_1056MHz_v1.23.bin' "$DDRINC" || true)
          [ "$n_after" -eq 1 ] || { echo "!! DDR 替换未生效（1056_v1.23 命中 $n_after 次）"; exit 1; }
          echo "--- DDR 固件: 框架默认 1560_v1.21 → 已替换为 1056_v1.23（=K1 真机 eMMC 原厂 03ea844c5d 同款）"

      - name: Board static gate (csc / extensions / 网络栈)
        # 构建前秒级静态门 —— CI #66 的教训：csc 少了 NETWORKING_STACK="none"，
        # 框架按 rk35xx family 默认推导成 systemd-networkd → 装 netplan.io，
        # 这类「配置缺失」原本要等 verify-image.sh 在 100 分钟后才红。全部提前到现在判死。
        run: |
          set -e
          echo "--- 板级静态门（csc / 扩展 / 网络栈）---"
          CSC=k1/config/boards/kickpi-k1.csc
          # ① 网络栈：CI #66 白跑 100 分钟的根因，缺了必装 netplan.io
          grep -q 'declare -g NETWORKING_STACK="none"' "$CSC" \
            || { echo "!! csc 缺 NETWORKING_STACK=none —— 会装 netplan.io，被包黑名单断言拦下（CI #66 教训）"; exit 1; }
          echo "    ✅ NETWORKING_STACK=none"
          # ② RELEASE 三处同值（技能 §1：csc 钉死，否则本地构建停在交互菜单）
          grep -q 'declare -g RELEASE="trixie"' "$CSC" \
            || { echo "!! csc 缺 declare -g RELEASE=trixie（本地构建会停在交互选择）"; exit 1; }
          echo "    ✅ RELEASE=trixie 已钉死"
          # ③ 三个 post_family_tweaks 钩子必须在位（board 名里连字符→下划线）
          for h in hold_dtb network_interfaces disable_smartmontools; do
            grep -q "function post_family_tweaks__kickpi_k1_$h" "$CSC" \
              || { echo "!! csc 缺钩子 post_family_tweaks__kickpi_k1_$h"; exit 1; }
          done
          echo "    ✅ 三钩子在位（hold_dtb / network_interfaces / disable_smartmontools）"
          # ④ ENABLE_EXTENSIONS 白名单必须覆盖全部自建扩展（漏一个 = 扩展永不加载且不报错）
          #    注意：本 step 自己的 grep 模式也含 ENABLE_EXTENSIONS="…"，直接 grep 会先匹配到
          #    自己（head -1 取到 [^"]+ → 白名单全挂，CI #67 本地模拟抓到）。只认含逗号的真实列表。
          EXTS=$(grep -oE 'ENABLE_EXTENSIONS="[^",]+(,[^"]+)+"' k1/.github/workflows/build.yml | head -1 | sed 's/ENABLE_EXTENSIONS="//;s/"//')
          for f in k1/extensions/*.sh; do
            b=$(basename "$f" .sh)
            echo "$EXTS" | tr ',' '\n' | grep -qx "$b" \
              || { echo "!! 扩展 $b 不在 ENABLE_EXTENSIONS 白名单里（框架永远不会加载它）"; exit 1; }
          done
          echo "    ✅ 扩展白名单覆盖全部 $(ls k1/extensions/*.sh | wc -l) 个"
          # ⑤ 判据自身可跑（负例不响 = 判据没在干活）
          python3 k1/tools/dts-lint.py --selftest >/dev/null
          python3 k1/tools/verify-assert-lint.py k1/tools/verify-image.sh >/dev/null
          python3 k1/tools/patch-hunk-lint.py k1/patch/ >/dev/null
          echo "    ✅ 三个判据自检全过（dts-lint / verify-assert-lint / patch-hunk-lint）"

      - name: Board DTS syntax gate
        # 板级 DTS 语法门（1 秒）—— 与 lyw-OS 构建流程对齐（2026-10-29）。
        # 它挡的是"纯文本可判定、却要等内核 make 才报"的错：T68M 线两次真实事故，
        # `poll-interval = <100>;` 写成 `100>;` 烧掉 3414 秒（57 分钟）、
        # `ports { }` 之后又写属性烧掉 3608 秒。K1 线此前没有这道门，
        # 同类手滑会白烧整轮构建。真正的 dtc 编译仍由内核 make 兜底。
        run: |
          set -e
          echo "--- 板级 DTS 语法门（含判据自测）---"
          # 先跑判据自身的正/负例自测：负例不响 = 判据没在干活（T68M run #65 就是
          # "只查括号配平、漏了属性在子节点之后"，白烧 3608 秒）。
          python3 k1/tools/dts-lint.py --selftest
          python3 k1/tools/dts-lint.py k1/patch/kernel/rk35xx-vendor-6.1/dt/*.dts
          echo "    ✅ 板级 DTS 语法形态通过"

      - name: Install KICKPI K1 extensions
        # 扩展放在 userpatches/extensions/ —— 框架会自动搜索该目录并加载。
        # 关键：框架只加载【可执行】的扩展脚本，权限不对会被静默跳过
        # （日志表现：Extension search result [ Found 0 extensions ]）
        run: |
          set -e
          mkdir -p build/userpatches/extensions
          cp -v k1/extensions/*.sh build/userpatches/extensions/
          chmod +x build/userpatches/extensions/*.sh
          ls -l build/userpatches/extensions/
          echo "--- extension critical markers:"
          grep -nE 'custom_kernel_config__|opts_[ym]|MAXIO_PHY|roceos' \
                build/userpatches/extensions/*.sh
          grep -q 'kickpi_k1_roceos' build/userpatches/extensions/kickpi-k1-roceos.sh \
            || { echo "!! roceos 扩展缺失"; exit 1; }
          grep -q 'kickpi_k1_storage_irq' build/userpatches/extensions/kickpi-k1-kernel-config.sh \
            || { echo "!! kernel-config 扩展缺失（AHCI_DWC/PCI_MSI 兜底）"; exit 1; }
          # 在线更新护栏（两条互补，都不要少）：
          #   1) module-selfheal：板级 PHY 驱动【模块化】+ DKMS + 内核 postinst 钩子 + 开机自愈
          #      —— 这是"在线更新内核后网口还能起来"的正解（lyw-kf/飞牛线已实机跑通）。
          #   2) update-guard：更新后自动体检 + 引导快照回滚兜底 + 救急通道自检（刻意不钉内核）。
          grep -q 'kickpi_k1_module_selfheal' build/userpatches/extensions/kickpi-k1-module-selfheal.sh \
            || { echo "!! module-selfheal 扩展缺失（换内核后网口无法自愈）"; exit 1; }
          grep -q 'kickpi_k1_update_guard' build/userpatches/extensions/kickpi-k1-update-guard.sh \
            || { echo "!! update-guard 扩展缺失（更新后体检/回滚兜底缺失）"; exit 1; }
          # NVMe 自愈：pcie30 PHY 上电时序兜底（实机定案：PHY init t≈13.9s 早于
          # pcie30_avdd0v9/1v8 就绪 t≈15.1s → lock failed → 冷启动 NVMe 不上盘）
          grep -q 'kickpi_k1_nvme_selfheal' build/userpatches/extensions/kickpi-k1-nvme-selfheal.sh \
            || { echo "!! nvme-selfheal 扩展缺失（冷启动 NVMe 不上盘时无人救）"; exit 1; }
          # 网口角色归一：用户定义 ETH0=WAN / eth1=LAN（roceos 向导会按枚举顺序分反）
          grep -q 'kickpi_k1_net_roles' build/userpatches/extensions/kickpi-k1-net-roles.sh \
            || { echo "!! net-roles 扩展缺失（角色会被向导分反，用户拿到的是反的）"; exit 1; }

          # 网口 DTS 门禁（2026-10-17）：phy-mode 必须 rgmii（rgmii-id 在 rk3568 dwmac 上会把 MAC
          # 延迟清零 → 56B 丢 65%）+ 精确延迟值；PHY 节点必须写 eee-broken-1000t（EEE 1G 在 Maxio
          # MAE0621A 上会让 RX 侧 LPI 疯狂进出、能发不能收 —— 实机 1400 万次 LPI、整口失联）。
          DTS=build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1.dts
          grep -q 'phy-mode = "rgmii"' "$DTS" || { echo "!! DTS phy-mode 不是 rgmii"; exit 1; }
          grep -q 'tx_delay = <0x21>' "$DTS" && grep -q 'rx_delay = <0x3c>' "$DTS" \
            || { echo "!! DTS 缺 gmac0 延迟 0x21/0x3c"; exit 1; }
          grep -q 'tx_delay = <0x2f>' "$DTS" && grep -q 'rx_delay = <0x39>' "$DTS" \
            || { echo "!! DTS 缺 gmac1 延迟 0x2f/0x39"; exit 1; }
          [ "$(grep -c 'eee-broken-1000t' "$DTS")" -ge 2 ] \
            || { echo "!! PHY 节点缺 eee-broken-1000t（EEE 1G 会把 Maxio PHY 的 RX 打死）"; exit 1; }
          # 反向：只关 1G 是本板定案，100M 的 EEE 保留官方默认，不得顺手关干净
          if grep -qE 'eee-broken-(100baseT|100baseTx|10baseT|all)' "$DTS"; then
            echo "!! DTS 出现 eee-broken-100baseT/all（本板定案只关 1G，100M EEE 必须保留）"; exit 1
          fi
          echo "    OK  DTS: rgmii + 延迟 + eee-broken-1000t（只关 1G，100M 保留）"

      - name: Fetch roceos web-UI payload into userpatches/overlay
        # 官方 iNextOS 镜像自带 roceos 网页后台（/opt/roceos + /opt/roceos-ai + 3 个
        # systemd 服务 + nginx 站点与证书 + Flask 栈）—— 没有它，板子能启动但网页后台是空的。
        # 走框架正规通道 userpatches/overlay 交给扩展在【构建阶段】装进镜像。
        run: |
          set -e
          mkdir -p build/userpatches/overlay
          URL="https://github.com/linyueweia/lyw-OS/releases/download/roceos-payload-v1/roceos-payload.tar.gz"
          curl -fsSL -o build/userpatches/overlay/roceos-payload.tar.gz "$URL"
          # 指纹固定断言：内容一变立即失败
          echo "6b819584a1b1701163f8983bd59a31821643f64dd65c76ba8f500ef54c5e8bb5  build/userpatches/overlay/roceos-payload.tar.gz" | sha256sum -c -
          ls -l build/userpatches/overlay/
          echo "--- 扩展清单（应含 kickpi-k1-roceos.sh）:"
          ls -l build/userpatches/extensions/ 2>/dev/null || true

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Build iNextOS image
        run: |
          cd build
          # 注释必须放在整条命令【之前】：放进 "\" 续行之间会把后续参数整段注释掉
          # （曾因此丢掉 KERNEL_CONFIGURE=no，框架弹出交互式菜单并以 error 43 失败）
          # ENABLE_EXTENSIONS 是扩展白名单（框架逐个 enable_extension），必须含自建扩展
          # BUILD_MINIMAL=yes —— 与官方 R1 发布件同口径（官方文件名正是
          #   iNextOSA_26.2.1_Easepi-r1_trixie_vendor_6.1.115_minimal.img.xz），
          #   2026-10-29 与 lyw-OS 构建流程对齐（本仓此前传的是 no）。
          #   传 no 会装 framework 的 config/cli/<rel>/main/packages.additional 整份
          #   （avahi-autoipd / unattended-upgrades / vnstat / iperf3 / plymouth /
          #   dkms / rng-tools / build-essential …），T68M 线实测装出 958 包，
          #   官方 minimal 是 718 包。其中 avahi-autoipd 会在 DHCP 失败时往网卡塞
          #   169.254 链路本地地址、unattended-upgrades 会在后台升级并重启
          #   dnsmasq/网络服务 —— 都会表现为"网口灯亮、下级设备拿不到 IP /
          #   用几小时就掉"，与官方行为不一致。
          # 注：本框架没有 INSTALL_HEADERS 开关；内核 headers 由 kickpi-k1-module-selfheal 扩展
          #     自己 apt/dpkg 装进镜像（可选件，只为离线重编；换内核后 postinst 钩子也会自动拉）。
          ./compile.sh build \
            BOARD=kickpi-k1 \
            BRANCH=vendor \
            RELEASE=trixie \
            ENABLE_EXTENSIONS="istorenext,kickpi-k1-maxio,kickpi-k1-roceos,kickpi-k1-kernel-config,kickpi-k1-module-selfheal,kickpi-k1-nvme-selfheal,kickpi-k1-net-roles,kickpi-k1-update-guard" \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,img,xz" \
            SHARE_LOG=yes \
            EXPERT=yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-process verification (bootloader / DTB IP blocks / DDR fingerprint)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          # (0a) 包集合必须与官方 minimal 同口径：镜像文件名带 _minimal 才说明
          #      BUILD_MINIMAL=yes 真生效（框架 rootfs-to-image.sh:21 用这个后缀）。
          #      与 lyw-OS 对齐（2026-10-29）：本仓此前传 BUILD_MINIMAL=no，
          #      会装进 framework 的 packages.additional 整份（官方 R1 没有）。
          case "$IMG" in
            *_minimal*) echo "    ✅ 镜像名含 _minimal（与官方 R1 发布件同口径）" ;;
            *) echo "!! 镜像名不含 _minimal：BUILD_MINIMAL 没有传 yes，会装进官方没有的一整批包" ; exit 1 ;;
          esac
          # 注意路径：板级仓库在 CI 里检出到 ./k1（其余步骤也一律用 k1/…），
          # 写成 tools/… 会报 "cannot access 'tools/verify-image.sh'" 并在镜像
          # 已经编好的情况下把整发判失败（实测踩到）。
          chmod +x k1/tools/verify-image.sh
          # 必须 root：脚本要 losetup + mount 镜像分区（缺 sudo 会报
          #   mkdir: cannot create directory '/mnt/ib_v': Permission denied
          #   losetup: ... failed to set up loop device）
          sudo -E bash k1/tools/verify-image.sh "$IMG"

      - name: Verify image (Maxio PHY driver / dual GbE / DTB)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -1)
          echo "IMG=$IMG"
          LOOP=$(sudo losetup --show -f -P "$IMG")
          echo "LOOP=$LOOP"
          sudo mkdir -p /mnt/ib /mnt/ir
          sudo mount "${LOOP}p1" /mnt/ib || true
          sudo mount "${LOOP}p2" /mnt/ir || true
          echo "--- p1 内容:";  ls /mnt/ib | head -20
          echo "--- p2 内容:";  ls /mnt/ir | head -20
          FAIL=0

          # ── 检查 1：内核配置里板级网络驱动必须【模块 =m】（双千兆命门 + 在线更新自愈前提）──
          # 为什么断 =m 而不是 =y：内建驱动在"在线更新换了内核"时无法补救（不能装载/重建）；
          # 模块化才有 DKMS + postinst 钩子 + 开机自愈这条链（extensions/kickpi-k1-module-selfheal.sh）。
          # 为什么 MAC 侧也要 =m：phylib 在 MAC 探测时就绑 PHY，内建 MAC 会抢绑通用驱动，
          # 晚到的 maxio 被跳过（lyw-kf PORTING 坑④ 实测）。
          CFG=$(ls /mnt/ib/config-* /mnt/ir/boot/config-* 2>/dev/null | head -1 || true)
          if [ -n "$CFG" ]; then
            echo "--- kernel config: $CFG"
            for sym in MAXIO_PHY STMMAC_ETH STMMAC_PLATFORM DWMAC_ROCKCHIP; do
              if grep -qE "^CONFIG_${sym}=m" "$CFG"; then
                echo "  OK  CONFIG_${sym}=m"
              else
                echo "  !!  CONFIG_${sym} 不是 =m —— 内建/未开都会让在线更新后无法恢复网口"; FAIL=1
              fi
            done
            grep -E '^CONFIG_(MAXIO_PHY|MOTORCOMM_PHY|REALTEK_PHY|AIC8800_WLAN_SUPPORT|STMMAC_ETH|STMMAC_PLATFORM|DWMAC_ROCKCHIP)=' "$CFG" || true
            # 模块本体 + 自愈链必须真的落进 rootfs（配置对了但文件没进镜像 = 等于没有）
            KO=$(ls /mnt/ir/lib/modules/*/kernel/drivers/net/phy/maxio.ko 2>/dev/null | head -1 || true)
            [ -n "$KO" ] && echo "  OK  maxio.ko -> $KO" || { echo "  !!  rootfs 里没有 maxio.ko（=m 构建产物缺失）"; FAIL=1; }
            for f in usr/src/kickpi-k1/maxio.c usr/local/sbin/kickpi-k1-build-maxio \
                     usr/local/sbin/kickpi-k1-load-modules etc/kernel/postinst.d/zz-kickpi-k1-maxio \
                     etc/modprobe.d/kickpi-k1.conf; do
              [ -e "/mnt/ir/$f" ] && echo "  OK  自愈件 $f" || { echo "  !!  缺自愈件 $f（换内核后网口救不回）"; FAIL=1; }
            done
            grep -q 'softdep dwmac-rockchip pre: maxio' /mnt/ir/etc/modprobe.d/kickpi-k1.conf 2>/dev/null \
              && echo "  OK  softdep（maxio 先于 MAC 驱动注册）" \
              || { echo "  !!  缺 softdep（PHY 会被通用驱动抢绑）"; FAIL=1; }
          else
            echo "  !!  镜像里找不到内核 config 文件"; FAIL=1
          fi

          # ── 检查 2：板级 DTB 必须存在、且两个 GMAC 都是 okay ──
          # 需要 dtc 反解 DTB；runner 默认没装（上一轮就因此失败：sudo: dtc: command not found）
          if ! command -v dtc >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq device-tree-compiler >/dev/null 2>&1 || true
          fi
          command -v dtc >/dev/null 2>&1 && echo "  dtc: $(dtc --version 2>&1 | head -1)" || echo "  ✗ dtc 仍不可用"
          DTB=$(ls /mnt/ib/dtb/rockchip/rk3568-kickpi-k1.dtb 2>/dev/null | head -1 || true)
          if [ -n "$DTB" ]; then
            echo "--- dtb: $DTB"
            dtc -I dtb -O dts "$DTB" -o /tmp/k1.dts 2>/dev/null || sudo dtc -I dtb -O dts "$DTB" -o /tmp/k1.dts
            echo "  model     : $(grep -m1 'model =' /tmp/k1.dts)"
            echo "  compatible: $(grep -m1 'compatible = \"kickpi' /tmp/k1.dts)"
            grep -A12 'ethernet@fe2a0000' /tmp/k1.dts | grep -m1 status | sed 's/^/  gmac0: /'
            grep -A12 'ethernet@fe010000' /tmp/k1.dts | grep -m1 status | sed 's/^/  gmac1: /'
            grep -q 'rockchip,rk3568-kickpi-k1\|kickpi,k1' /tmp/k1.dts || { echo "  !!  DTB 里没有 kickpi 标识"; FAIL=1; }
          else
            echo "  !!  镜像里找不到 rk3568-kickpi-k1.dtb"; FAIL=1
          fi

          if [ -n "$CFG" ]; then
            # 显示链路：显式断言（HDMI 报告：这些原先全靠 select/default，defconfig 无一字）
            if grep -qE '^CONFIG_DRM_ROCKCHIP=y' "$CFG" \
               && grep -qE '^CONFIG_ROCKCHIP_DW_HDMI=y' "$CFG" \
               && grep -qE '^CONFIG_DRM_DW_HDMI_CEC=y' "$CFG" \
               && grep -qE '^CONFIG_DRM_EDID=y' "$CFG" \
               && grep -qE '^CONFIG_DRM_LOAD_EDID_FIRMWARE=y' "$CFG"; then
              echo "  OK  DRM/HDMI/CEC/EDID 配置在位"
            else
              echo "  !!  DRM/HDMI 链路配置缺失（显示/CEC/EDID 会静默失效）"; FAIL=1
            fi
            # 实机 /proc/modules 无 ahci*（SATA 主机内建）→ 必须 =y：=m 时 rootfs 没有该 .ko，
            # SATA 不 probe、root-on-SATA/热插拔全无（旧门禁 `CONFIG_AHCI_DWC=` 连 =m 都放行）。
            if grep -qE '^CONFIG_SATA_AHCI_PLATFORM=y|^CONFIG_AHCI_DWC=y' "$CFG"; then
              echo "  OK  SATA AHCI 配置在位（=y 内建）"
            else
              echo "  !!  SATA AHCI 配置缺失或为 =m（实机有 ata1 控制器）"; FAIL=1
            fi
            # 实机 /proc/config.gz: PCI_MSI=y；6.1 里 arm64 不 select、Kconfig 无 default →
            # 不显式开就退化到 INTx（NVMe 队列/中断亲和失效，吞吐与 CPU 占用劣化）。
            if grep -qE '^CONFIG_PCI_MSI=y' "$CFG"; then
              echo "  OK  CONFIG_PCI_MSI=y"
            else
              echo "  !!  CONFIG_PCI_MSI 未启用（NVMe/PCIe 将退化 INTx）"; FAIL=1
            fi
            if grep -qE '^CONFIG_USB_SERIAL_OPTION=m|^CONFIG_USB_NET_QMI_WWAN=m' "$CFG"; then
              echo "  OK  4G/5G(USB 串口/QMI) 配置在位"
            else
              echo "  !!  4G/5G 相关配置缺失"; FAIL=1
            fi
          fi

          # ── 检查 3：armbianEnv 指向我们的 dtb ──
          if [ -f /mnt/ib/armbianEnv.txt ]; then
            echo "--- armbianEnv.txt:"; cat /mnt/ib/armbianEnv.txt
            grep -q 'rk3568-kickpi-k1.dtb' /mnt/ib/armbianEnv.txt \
              || { echo "  !!  armbianEnv.txt 未指向 rk3568-kickpi-k1.dtb"; FAIL=1; }
          fi

          sudo umount /mnt/ib /mnt/ir 2>/dev/null || true
          sudo losetup -d "$LOOP" || true
          [ "$FAIL" = "0" ] || { echo "!! 镜像自证失败"; exit 1; }
          echo "== 全部自证通过 =="

      - name: Show outputs
        run: |
          ls -lh build/output/images/ || true
          cat build/output/images/*.sha 2>/dev/null || true

      - name: Upload iNextOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inextos-kickpi-k1
          # 只打包压缩版（参照 lyw-OS）：raw .img 与 .img.xz 内容等价，
          # raw 里全是零字节区，zip 再压一遍纯属浪费带宽/存储/下载时间。
          path: |
            build/output/images/*.img.xz
            build/output/images/*.sha
          retention-days: 14
          if-no-files-found: error
